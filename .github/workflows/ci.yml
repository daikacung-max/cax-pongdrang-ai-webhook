name: AI Core CI

on:
  push:
    branches:
      - main
      - ai-core-hardening
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run unit tests
        env:
          ENABLE_DEMO_CONSOLE: 'false'
          PRODUCTION_MODE: 'false'
        shell: bash
        run: |
          set -o pipefail
          python -m unittest discover -s tests -v 2>&1 | tee test-output.txt
      - name: Upload test output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-core-test-output
          path: test-output.txt

  production-smoke:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Verify production health, security boundary, real Notebook demo, provider, Zalo boundary, and VNeID routing
        shell: bash
        run: |
          python - <<'PY'
          import json
          import re
          import time
          import urllib.error
          import urllib.parse
          import urllib.request
          import uuid

          base = "https://cax-pongdrang-ai.onrender.com"

          def get_json(path, timeout=8):
              with urllib.request.urlopen(base + path, timeout=timeout) as r:
                  return json.load(r)

          def post_json(path, payload, timeout=20, headers=None):
              req_headers = {"Content-Type": "application/json"}
              req_headers.update(headers or {})
              req = urllib.request.Request(
                  base + path,
                  data=json.dumps(payload, ensure_ascii=False).encode("utf-8"),
                  headers=req_headers,
                  method="POST",
              )
              with urllib.request.urlopen(req, timeout=timeout) as r:
                  return json.load(r)

          def expect_http(path, expected, method="GET", payload=None, timeout=8):
              data = None
              headers = {}
              if payload is not None:
                  data = json.dumps(payload, ensure_ascii=False).encode("utf-8")
                  headers["Content-Type"] = "application/json"
              req = urllib.request.Request(base + path, data=data, headers=headers, method=method)
              try:
                  with urllib.request.urlopen(req, timeout=timeout) as r:
                      status = r.status
              except urllib.error.HTTPError as exc:
                  status = exc.code
              assert status == expected, f"{path} status={status}, expected={expected}"
              return status

          last_error = None
          for attempt in range(1, 7):
              try:
                  health = get_json("/health", 6)
                  readiness = get_json("/health/readiness", 6)
                  with urllib.request.urlopen(base + "/demo", timeout=8) as r:
                      demo_html = r.read().decode("utf-8", errors="replace")
                  notebook = get_json("/demo/api/notebook-sources", 8)

                  assert health.get("status") == "ok", "health status"
                  assert health.get("mode") == "CAX_PONG_DRANG_AI_CORE", "AI Core mode"
                  assert health.get("unit") == "Công an xã Pơng Drang, tỉnh Đắk Lắk", "unit"
                  assert health.get("hotline") == "02623509777", "hotline"
                  assert health.get("demo_console_enabled") is True, "demo console disabled"
                  assert readiness.get("production_mode") is True, "production mode"
                  assert readiness.get("model_routing_mode") == "auto", "model routing"

                  # Production-only internal surfaces must not be public.
                  debug_status = expect_http("/debug/article/134", 404)
                  api_chat_status = expect_http(
                      "/api/chat",
                      404,
                      method="POST",
                      payload={"user_id": "synthetic", "message": "xin chao"},
                  )

                  assert "HÀNH CHÍNH CÔNG - CÔNG AN XÃ PƠNG DRANG" in demo_html, "Notebook demo title missing"
                  assert int(notebook.get("source_count") or 0) == 19, f"Notebook source_count={notebook.get('source_count')}"
                  source_titles = [str(x.get("title") or "") for x in (notebook.get("sources") or [])]
                  assert len(source_titles) == 19, f"Notebook sources={len(source_titles)}"
                  assert source_titles[0] == "1. Đăng ký thường trú.pdf", f"first Notebook source={source_titles[:1]}"
                  assert source_titles[-1] == "19. Sát hạch cấp giấy phép lái xe.pdf", f"last Notebook source={source_titles[-1:]}"

                  if readiness.get("openai_provider_ready"):
                      expected_core = "gpt-5.6-terra"
                      expected_dynamic = "gpt-5.6-luna"
                      expected_provider = "openai"
                  else:
                      assert readiness.get("groq_provider_ready") is True, "no LLM provider ready"
                      expected_core = "openai/gpt-oss-120b"
                      expected_dynamic = "openai/gpt-oss-20b"
                      expected_provider = "groq"

                  assert health.get("core_answer_model") == expected_core, f"core model={health.get('core_answer_model')}"
                  assert health.get("dynamic_answer_model") == expected_dynamic, f"dynamic model={health.get('dynamic_answer_model')}"
                  assert health.get("core_answer_provider") == expected_provider, f"core provider={health.get('core_answer_provider')}"
                  assert health.get("dynamic_answer_provider") == expected_provider, f"dynamic provider={health.get('dynamic_answer_provider')}"

                  if readiness.get("zalo_webhook_enabled"):
                      assert readiness.get("zalo_signature_secret_ready") is True, "Zalo signature secret missing"
                      assert readiness.get("zalo_signature_required") is True, "Zalo signature check disabled"
                  if readiness.get("zalo_direct_reply_enabled"):
                      assert readiness.get("zalo_direct_reply_ready") is True, "Zalo OA reply credentials missing"

                  forged_body = json.dumps({
                      "app_id": "synthetic-app",
                      "timestamp": "1",
                      "event_name": "user_send_text",
                  }).encode("utf-8")
                  forged_req = urllib.request.Request(
                      base + "/zalo/webhook",
                      data=forged_body,
                      headers={"Content-Type": "application/json", "X-ZEvent-Signature": "forged"},
                      method="POST",
                  )
                  forged_status = None
                  try:
                      urllib.request.urlopen(forged_req, timeout=8)
                      raise AssertionError("forged Zalo webhook was accepted")
                  except urllib.error.HTTPError as exc:
                      forged_status = exc.code
                      assert exc.code == 401, f"forged webhook status={exc.code}"

                  empty_uid = "synthetic-empty-" + uuid.uuid4().hex
                  dynamic = get_json("/zalo/ai?uid=" + empty_uid, 8)
                  assert dynamic.get("version") == "chatbot", "Dynamic version"
                  messages = ((dynamic.get("content") or {}).get("messages") or [])
                  assert messages and messages[0].get("type") == "text", "Dynamic text contract"

                  question = "Bạn hãy hướng dẫn cho tôi làm định danh mức 2"
                  demo_session = str(uuid.uuid4())
                  demo_chat = post_json("/demo/api/ai-chat", {
                      "session_id": demo_session,
                      "message": question,
                  })
                  answer = str(demo_chat.get("answer") or "").strip()
                  source_ids = [str(x) for x in (demo_chat.get("sources") or [])]
                  assert demo_chat.get("mode") == "full_ai_core", "demo is not Full Core"
                  assert demo_chat.get("artifact_backed") is True, "demo lost Artifact Core"
                  assert demo_chat.get("memory") is True, "demo memory flag"
                  assert answer, "demo empty answer"
                  assert demo_chat.get("model") == expected_core, f"demo model={demo_chat.get('model')}"
                  assert demo_chat.get("provider") == expected_provider, f"demo provider={demo_chat.get('provider')}"
                  assert demo_chat.get("path") not in {
                      "api_boundary_grounded_fallback",
                      "full_core_grounded_fallback",
                      "legal_no_source_fail_closed",
                  }, f"fallback path={demo_chat.get('path')}"
                  assert source_ids, "VNeID question retrieved no sources"
                  assert source_ids[0] == "VNEID_2026:level2", f"wrong first source={source_ids[0]}"
                  assert all(x.startswith("VNEID_") for x in source_ids), f"wrong source notebook={source_ids}"
                  assert ("Công an xã" in answer or "Công an cấp xã" in answer), f"missing commune guidance: {answer}"
                  assert "5230/QĐ-BCA-C06" not in answer, f"identity fallback leaked: {answer}"
                  assert not re.search(r"\b[A-Z][A-Z0-9_]{3,}:\w+", answer), f"internal source id leaked: {answer}"
                  for phrase in ("Số xx", "giờ hành chính", "tài khoản ngân hàng", "mã số thuế", "hồ sơ y tế"):
                      assert phrase.casefold() not in answer.casefold(), f"unsourced detail {phrase}: {answer}"

                  demo_history = get_json(
                      "/demo/api/ai-history?session_id=" + urllib.parse.quote(demo_session),
                      8,
                  )
                  demo_messages = demo_history.get("messages") or []
                  assert len(demo_messages) >= 2, f"demo memory missing turn: {demo_messages}"
                  assert demo_messages[-2].get("role") == "user", "demo user turn not stored"
                  assert demo_messages[-1].get("role") == "assistant", "demo assistant turn not stored"

                  safe = {
                      "status": health.get("status"),
                      "mode": health.get("mode"),
                      "unit": health.get("unit"),
                      "hotline": health.get("hotline"),
                      "demo_console_enabled": health.get("demo_console_enabled"),
                      "notebook_source_count": notebook.get("source_count"),
                      "demo_live_chat": True,
                      "demo_memory": True,
                      "debug_surface_closed": debug_status == 404,
                      "public_api_chat_closed": api_chat_status == 404,
                      "core_answer_model": health.get("core_answer_model"),
                      "dynamic_answer_model": health.get("dynamic_answer_model"),
                      "core_answer_provider": health.get("core_answer_provider"),
                      "dynamic_answer_provider": health.get("dynamic_answer_provider"),
                      "production_mode": readiness.get("production_mode"),
                      "model_routing_mode": readiness.get("model_routing_mode"),
                      "groq_provider_ready": readiness.get("groq_provider_ready"),
                      "openai_provider_ready": readiness.get("openai_provider_ready"),
                      "zalo_webhook_enabled": readiness.get("zalo_webhook_enabled"),
                      "zalo_signature_required": readiness.get("zalo_signature_required"),
                      "zalo_signature_ready": readiness.get("zalo_signature_ready"),
                      "zalo_forged_webhook_status": forged_status,
                      "zalo_dynamic_contract": "chatbot_text",
                      "zalo_direct_reply_enabled": readiness.get("zalo_direct_reply_enabled"),
                      "zalo_direct_reply_ready": readiness.get("zalo_direct_reply_ready"),
                      "zalo_oauth_refresh_ready": readiness.get("zalo_oauth_refresh_ready"),
                      "zalo_end_to_end_reply_ready": readiness.get("zalo_end_to_end_reply_ready"),
                      "full_core_live_path": demo_chat.get("path"),
                      "full_core_verified": demo_chat.get("verified"),
                      "vneid_level2_first_source": source_ids[0],
                      "vneid_level2_source_count": len(source_ids),
                  }
                  print(json.dumps(safe, ensure_ascii=False, indent=2))
                  with open("production-smoke.json", "w", encoding="utf-8") as f:
                      json.dump(safe, f, ensure_ascii=False, indent=2)
                  break
              except Exception as exc:
                  last_error = exc
                  print(f"attempt={attempt} error={type(exc).__name__}: {exc}", flush=True)
                  if attempt < 6:
                      time.sleep(5)
          else:
              raise SystemExit(f"Production smoke failed: {type(last_error).__name__}: {last_error}")
          PY
      - name: Upload production smoke result
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: production-smoke
          path: production-smoke.json
