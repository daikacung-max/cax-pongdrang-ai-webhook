name: AI Core CI

on:
  push:
    branches:
      - main
      - ai-core-hardening
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run unit tests
        env:
          ENABLE_DEMO_CONSOLE: 'false'
          PRODUCTION_MODE: 'false'
        shell: bash
        run: |
          set -o pipefail
          python -m unittest discover -s tests -v 2>&1 | tee test-output.txt
      - name: Upload test output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-core-test-output
          path: test-output.txt

  production-smoke:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Wait for production and verify health, legal anchor, and Full Core provider
        shell: bash
        run: |
          python - <<'PY'
          import json
          import time
          import urllib.request
          import uuid

          base = "https://cax-pongdrang-ai.onrender.com"
          last_error = None
          for _ in range(24):
              try:
                  with urllib.request.urlopen(base + "/health", timeout=8) as r:
                      health = json.load(r)
                  with urllib.request.urlopen(base + "/health/readiness", timeout=8) as r:
                      readiness = json.load(r)
                  with urllib.request.urlopen(base + "/debug/article/134", timeout=8) as r:
                      article = json.load(r)

                  assert health.get("status") == "ok"
                  assert health.get("mode") == "CAX_PONG_DRANG_AI_CORE"
                  assert health.get("unit") == "Công an xã Pơng Drang, tỉnh Đắk Lắk"
                  assert health.get("hotline") == "02623509777"
                  assert health.get("core_answer_model") == "openai/gpt-oss-120b"
                  assert health.get("dynamic_answer_model") == "openai/gpt-oss-20b"
                  assert health.get("core_answer_provider") == "groq"
                  assert health.get("dynamic_answer_provider") == "groq"
                  assert readiness.get("model_routing_mode") == "auto"
                  assert readiness.get("groq_provider_ready") is True
                  assert article.get("found") is True
                  assert str(article.get("article")) == "134"

                  payload = json.dumps({
                      "user_id": "synthetic-smoke-" + uuid.uuid4().hex,
                      "message": "Xin chào"
                  }, ensure_ascii=False).encode("utf-8")
                  req = urllib.request.Request(
                      base + "/api/chat",
                      data=payload,
                      headers={"Content-Type": "application/json"},
                      method="POST",
                  )
                  with urllib.request.urlopen(req, timeout=20) as r:
                      chat = json.load(r)

                  answer = str(chat.get("answer") or "").strip()
                  meta = chat.get("meta") or {}
                  assert answer
                  assert meta.get("model") == "openai/gpt-oss-120b"
                  assert meta.get("provider") == "groq"
                  assert meta.get("path") not in {
                      "api_boundary_grounded_fallback",
                      "full_core_grounded_fallback",
                      "legal_no_source_fail_closed",
                  }

                  safe = {
                      "status": health.get("status"),
                      "mode": health.get("mode"),
                      "unit": health.get("unit"),
                      "hotline": health.get("hotline"),
                      "core_answer_model": health.get("core_answer_model"),
                      "dynamic_answer_model": health.get("dynamic_answer_model"),
                      "core_answer_provider": health.get("core_answer_provider"),
                      "dynamic_answer_provider": health.get("dynamic_answer_provider"),
                      "production_mode": readiness.get("production_mode"),
                      "model_routing_mode": readiness.get("model_routing_mode"),
                      "groq_provider_ready": readiness.get("groq_provider_ready"),
                      "openai_provider_ready": readiness.get("openai_provider_ready"),
                      "zalo_webhook_enabled": readiness.get("zalo_webhook_enabled"),
                      "zalo_signature_required": readiness.get("zalo_signature_required"),
                      "zalo_signature_ready": readiness.get("zalo_signature_ready"),
                      "zalo_direct_reply_enabled": readiness.get("zalo_direct_reply_enabled"),
                      "zalo_direct_reply_ready": readiness.get("zalo_direct_reply_ready"),
                      "article_134_title": article.get("title"),
                      "full_core_live_path": meta.get("path"),
                      "full_core_verified": meta.get("verified"),
                  }
                  print(json.dumps(safe, ensure_ascii=False, indent=2))
                  with open("production-smoke.json", "w", encoding="utf-8") as f:
                      json.dump(safe, f, ensure_ascii=False, indent=2)
                  break
              except Exception as exc:
                  last_error = exc
                  time.sleep(10)
          else:
              raise SystemExit(f"Production smoke failed: {type(last_error).__name__}: {last_error}")
          PY
      - name: Upload production smoke result
        uses: actions/upload-artifact@v4
        with:
          name: production-smoke
          path: production-smoke.json
