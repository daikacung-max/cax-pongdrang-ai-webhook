name: Official Go-Live Gate

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  verify-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Verify production go-live gate consistency
        shell: bash
        run: |
          python - <<'PY'
          import json
          import time
          import urllib.error
          import urllib.request

          url = "https://cax-pongdrang-ai.onrender.com/health/go-live"
          last = None
          for attempt in range(8):
              try:
                  req = urllib.request.Request(url, headers={"Cache-Control": "no-cache"})
                  try:
                      with urllib.request.urlopen(req, timeout=10) as response:
                          status = response.status
                          body = json.load(response)
                  except urllib.error.HTTPError as exc:
                      status = exc.code
                      body = json.loads(exc.read().decode("utf-8"))

                  ready = body.get("ready_for_official_operation") is True
                  blockers = body.get("blockers") or []
                  checks = body.get("checks") or {}
                  assert status in (200, 503), f"unexpected status={status}"
                  assert (status == 200) == ready, f"status/ready mismatch: {status} {ready}"
                  assert (not blockers) == ready, f"blockers/ready mismatch: {blockers}"
                  assert checks and all(isinstance(v, bool) for v in checks.values()), "invalid gate checks"
                  if ready:
                      assert all(checks.values()), f"ready with failed checks: {checks}"
                  else:
                      assert any(not value for value in checks.values()), "blocked without a failed check"
                  print(json.dumps({
                      "http_status": status,
                      "ready_for_official_operation": ready,
                      "blockers": blockers,
                      "checks": checks,
                  }, ensure_ascii=False, indent=2))
                  break
              except Exception as exc:
                  last = exc
                  print(f"attempt={attempt + 1} error={type(exc).__name__}: {exc}")
                  if attempt < 7:
                      time.sleep(5)
          else:
              raise SystemExit(f"go-live gate verification failed: {type(last).__name__}: {last}")
          PY
